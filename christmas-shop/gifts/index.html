<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christmas Shop</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="preload" href="../assets/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/montserrat-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/allura.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../modern-normalize.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="page">
  <div class="overlay"></div>
  <div class="modal card">
    <div class="close">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
        <path d="M30 10L10 30" stroke="#181C29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M10 10L30 30" stroke="#181C29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="modal__img card-img"></div>
    <div class="modal-text card-text">
      <div class="modal-text__top">

      </div>
      <div class="modal-text__bottom">
        <h4>Adds superpowers to:</h4>
        <div class="modal-powers">

        </div>
      </div>
    </div>
  </div>
  <header class="header">
    <div class="header__wrapper wrapper">
      <a class="logo" href="../">
        <img src="../assets/icons/snowflake.svg" alt="snowflake" height="24" width="24">
        <span class="action-small">the gifts</span>
      </a>
      <nav class="nav">
        <input id="nav__toggle" type="checkbox">
        <label class="nav__hamburger" for="nav__toggle">
          <span></span>
        </label>
        <ul class="nav__menu action-small">
          <li class="nav__menu-item"><a class="nav__menu-link nav__menu-link_act">Gifts</a></li>
          <li class="nav__menu-item"><a href="../#about" class="nav__menu-link">About</a></li>
          <li class="nav__menu-item"><a href="../#gifts" class="nav__menu-link">Best</a></li>
          <li class="nav__menu-item"><a href="#footer" class="nav__menu-link">Contacts</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="main">
    <section class="gifts">
      <div class="gifts__wrapper wrapper">
        <h1>Achieve health, harmony, and inner strength</h1>
        <div class="tabs">
          <button class="tabs__btn tabs__btn-all btn action-small" type="button" disabled>All</button>
          <button class="tabs__btn tabs__btn-work btn action-small" type="button">for work</button>
          <button class="tabs__btn tabs__btn-health btn action-small" type="button">for
            health</button>
          <button class="tabs__btn tabs__btn-harmony btn action-small" type="button">for
            harmony</button>
        </div>
        <div class="gifts__cards">

        </div>
      </div>
    </section>
  </main>
  <footer id="footer" class="footer">
    <div class="footer__wrapper wrapper">
      <ul class="footer__cards">
        <li class="footer__cards-item">
          <a href="tel:+375(29)111-22-33" class="footer__cards-link">
            <img src="../assets/icons/santa-claus.svg" alt="santa" height="80" width="80">
            <span class="action-large">+375 (29) 111-22-33</span>
            <h3>Call Us</h3>
          </a>
        </li>
        <li class="footer__cards-item">
          <a href="https://maps.app.goo.gl/hA3Lx6vf3UoomJ2U8" target="blank" class="footer__cards-link">
            <img src="../assets/icons/christmas-tree.svg" alt="tree" height="80" width="80">
            <span class="action-large">Magic forest</span>
            <h3>meet us</h3>
          </a>
        </li>
        <li class="footer__cards-item">
          <a href="mailto:gifts@magic.com" class="footer__cards-link">
            <img src="../assets/icons/snake.svg" alt="snake" height="80" width="80">
            <span class="action-large">gifts@magic.com</span>
            <h3>write us</h3>
          </a>
        </li>
      </ul>
      <div class="footer__social">
        <ul class="social">
          <li class="social__item">
            <a href="https://telegram.org" class="social__link">
              <img src="../assets/icons/telegram.svg" alt="telegram" height="24" width="24">
            </a>
          </li>
          <li class="social__item">
            <a href="https://facebook.com" class="social__link">
              <img src="../assets/icons/facebook.svg" alt="facebook" height="24" width="24">
            </a>
          </li>
          <li class="social__item">
            <a href="https://instagram.com" class="social__link">
              <img src="../assets/icons/instagram.svg" alt="instagram" height="24" width="24">
            </a>
          </li>
          <li class="social__item">
            <a href="https://x.com" class="social__link">
              <img src="../assets/icons/X.svg" alt="x" height="24" width="24">
            </a>
          </li>
        </ul>
        <p class="copyright">© Copyright 2025, All Rights Reserved</p>
        <a href="https://rs.school" target="blank" class="made caption">Made in Rolling Scopes School</a>
      </div>
    </div>
  </footer>
  <button class="btn-up" type="button" title="to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 5V19" stroke="#FF4646" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M18 11L12 5" stroke="#FF4646" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M6 11L12 5" stroke="#FF4646" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <script type="module" src="./js/gifts.js"></script>
</body>

</html>
